# A13 candidate: only free and local entrypoints.
# Limits are historical per-model observations from limits.json, not current remaining quota.
# The in-process limiter is per user/model and resets with the process.
# Other free providers require current eligibility and limits before admission.
version: v0.3
listeners:
- name: http-8899
  address: 0.0.0.0
  port: 8899
  timeout: 1800s
providers:
  defaults:
    model: groq-gpt-oss-20b
  models:
  - name: groq-gpt-oss-20b
    provider_model_id: openai/gpt-oss-20b
    backend_refs:
    - name: groq
      provider: vllm
      openai_compat_gateway: true
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      weight: 100
  - name: groq-gpt-oss-120b
    provider_model_id: openai/gpt-oss-120b
    backend_refs:
    - name: groq
      provider: vllm
      openai_compat_gateway: true
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      weight: 100
  - name: groq-qwen3.8-27b
    provider_model_id: qwen/qwen3.8-27b
    backend_refs:
    - name: groq
      provider: vllm
      openai_compat_gateway: true
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      weight: 100
  - name: local-qwen3-0.6b-q8
    provider_model_id: qwen3-0.6b-q8
    backend_refs:
    - name: groot-llamacpp
      provider: vllm
      openai_compat_gateway: true
      base_url: http://100.113.138.100:11530/v1
      weight: 100
routing:
  modelCards:
  - name: groq-gpt-oss-20b
  - name: groq-gpt-oss-120b
  - name: groq-qwen3.8-27b
  - name: local-qwen3-0.6b-q8
  decisions:
  - name: free-fanout
    description: Qualified free Groq models for small non-code calls. Other free providers
      remain unqualified.
    priority: 100
    rules:
      operator: AND
      conditions: []
    modelRefs:
    - model: groq-gpt-oss-20b
      use_reasoning: false
    - model: groq-gpt-oss-120b
      use_reasoning: false
    - model: groq-qwen3.8-27b
      use_reasoning: false
    algorithm:
      type: random
    fallback:
      enabled: true
      max_attempts: 3
      total_timeout: 60s
      per_attempt_timeout: 30s
      retryable_status_codes:
      - 413
      - 429
      - 500
      - 502
      - 503
      - 504
entrypoints:
- model_names:
  - vllm-sr/free
  recipe: default
- model_names:
  - vllm-sr/local
  recipe: local
recipes:
- name: local
  description: Local-only llama.cpp; no hosted fallback.
  routing:
    decisions:
    - name: local-only
      priority: 100
      rules:
        operator: AND
        conditions: []
      modelRefs:
      - model: local-qwen3-0.6b-q8
        use_reasoning: false
      algorithm:
        type: static
      fallback:
        enabled: false
global:
  router:
    fallback:
      enabled: true
      max_attempts: 3
      circuit_breaker:
        consecutive_failures: 2
        cooldown_period: 30s
        half_open_probes: 1
  services:
    ratelimit:
      fail_open: false
      providers:
      - type: local
        rules:
        - name: groq-gpt-oss-20b-minute
          match:
            model: groq-gpt-oss-20b
          requests_per_unit: 30
          tokens_per_unit: 8000
          unit: minute
        - name: groq-gpt-oss-20b-day
          match:
            model: groq-gpt-oss-20b
          requests_per_unit: 1000
          tokens_per_unit: 200000
          unit: day
        - name: groq-gpt-oss-120b-minute
          match:
            model: groq-gpt-oss-120b
          requests_per_unit: 30
          tokens_per_unit: 8000
          unit: minute
        - name: groq-gpt-oss-120b-day
          match:
            model: groq-gpt-oss-120b
          requests_per_unit: 1000
          tokens_per_unit: 200000
          unit: day
        - name: groq-qwen3.8-27b-minute
          match:
            model: groq-qwen3.8-27b
          requests_per_unit: 30
          tokens_per_unit: 8000
          unit: minute
        - name: groq-qwen3.8-27b-day
          match:
            model: groq-qwen3.8-27b
          requests_per_unit: 1000
          tokens_per_unit: 200000
          unit: day

version: v0.3
# Turbo v2 (2026-11-01): pool of measured free/fast backends for parallel small calls.
# Probed 2026-11-01 (probes.jsonl): Groq 3 models TTFT ~0.21s, Cerebras 2 models ~0.18-0.25s.
# Excluded: NVIDIA gpt-oss-20b (TTFT 18-29s), OpenRouter nemotron-3-super:free (no longer free),
# Cerebras uses provider vllm + openai_compat_gateway: the router rejects its non-canonical `time_info` field otherwise.
# OpenCode Zen free (API refuses: "free models work in OpenCode only"), DeepSeek (paid).
listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 1800s
providers:
  defaults:
    model: groq-gpt-oss-20b
  models:
    - name: groq-gpt-oss-20b
      provider_model_id: openai/gpt-oss-20b
      backend_refs:
        - {name: groq, provider: vllm, openai_compat_gateway: true, base_url: "https://api.groq.com/openai/v1", api_key_env: GROQ_API_KEY, weight: 100}
    - name: groq-gpt-oss-120b
      provider_model_id: openai/gpt-oss-120b
      backend_refs:
        - {name: groq, provider: vllm, openai_compat_gateway: true, base_url: "https://api.groq.com/openai/v1", api_key_env: GROQ_API_KEY, weight: 100}
    - name: groq-qwen3.8-27b
      provider_model_id: qwen/qwen3.8-27b
      backend_refs:
        - {name: groq, provider: vllm, openai_compat_gateway: true, base_url: "https://api.groq.com/openai/v1", api_key_env: GROQ_API_KEY, weight: 100}
    - name: cerebras-gpt-oss-120b
      provider_model_id: gpt-oss-120b
      backend_refs:
        - {name: cerebras, provider: vllm, openai_compat_gateway: true, base_url: "https://api.cerebras.ai/v1", api_key_env: CEREBRAS_API_KEY, weight: 100}
    - name: cerebras-qwen-3.8-27b
      provider_model_id: qwen-3.8-27b
      backend_refs:
        - {name: cerebras, provider: vllm, openai_compat_gateway: true, base_url: "https://api.cerebras.ai/v1", api_key_env: CEREBRAS_API_KEY, weight: 100}
    # --- free profiles (2026-11-02, profiles/eval_free.py: 20-task graded battery x2 per model) ---
    - name: nim-nemotron-3.5-lightning
      provider_model_id: nvidia/nemotron-3.5-lightning-30b-a3b
      backend_refs:
        - {name: nvidia, provider: vllm, openai_compat_gateway: true, base_url: "https://integrate.api.nvidia.com/v1", api_key_env: NVIDIA_API_KEY, weight: 100}
    - name: nim-nemotron-3-ultra
      provider_model_id: nvidia/nemotron-3-ultra-550b-a55b
      backend_refs:
        - {name: nvidia, provider: vllm, openai_compat_gateway: true, base_url: "https://integrate.api.nvidia.com/v1", api_key_env: NVIDIA_API_KEY, weight: 100}
    - name: or-nemotron-3-ultra-free
      provider_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
      backend_refs:
        - {name: openrouter, provider: vllm, openai_compat_gateway: true, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, weight: 100}
    - name: or-nemotron-3.5-super-vl-free
      provider_model_id: nvidia/nemotron-3.5-super-vl:free
      backend_refs:
        - {name: openrouter, provider: vllm, openai_compat_gateway: true, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, weight: 100}
    - name: or-dots-3-note-free
      provider_model_id: dots-studio/dots-3-note-preview:free
      backend_refs:
        - {name: openrouter, provider: vllm, openai_compat_gateway: true, base_url: "https://openrouter.ai/api/v1", api_key_env: OPENROUTER_API_KEY, weight: 100}
    - name: gemini-3.5-flash-lite
      provider_model_id: gemini-3.5-flash-lite
      backend_refs:
        - {name: gemini, provider: vllm, openai_compat_gateway: true, base_url: "https://generativelanguage.googleapis.com/v1beta/openai", api_key_env: GEMINI_API_KEY, weight: 100}
    # --- paid subscriptions (2026-11-03): host sub-proxy (subproxy/sub_proxy.py) attaches the owner's
    # Hermes-pool OAuth credentials; the router only sees VLLM_SR_SUBPROXY_TOKEN. 10.42.0.1 = groot cni0.
    - name: paid-claude-opus-5-5
      provider_model_id: claude-opus-5-5
      api_format: anthropic
      backend_refs:
        - {name: subproxy-anthropic, provider: anthropic, base_url: "http://10.42.0.1:18800/anthropic", api_key_env: VLLM_SR_SUBPROXY_TOKEN, weight: 100}
    - name: paid-gpt-6.1-sol
      provider_model_id: gpt-6.1-sol
      api_format: responses
      backend_refs:
        - {name: subproxy-codex, provider: openai, base_url: "http://10.42.0.1:18800/codex/v1", api_key_env: VLLM_SR_SUBPROXY_TOKEN, weight: 100}
    - name: paid-grok-4.7
      provider_model_id: grok-4.7
      backend_refs:
        - {name: subproxy-xai, provider: vllm, openai_compat_gateway: true, base_url: "http://10.42.0.1:18800/xai/v1", api_key_env: VLLM_SR_SUBPROXY_TOKEN, weight: 100}
routing:
  modelCards:
    - name: paid-claude-opus-5-5
    - name: paid-gpt-6.1-sol
    - name: paid-grok-4.7
    - name: groq-gpt-oss-20b
    - name: groq-gpt-oss-120b
    - name: groq-qwen3.8-27b
    - name: cerebras-gpt-oss-120b
    - name: cerebras-qwen-3.8-27b
    - name: nim-nemotron-3.5-lightning
    - name: nim-nemotron-3-ultra
    - name: or-nemotron-3-ultra-free
    - name: or-nemotron-3.5-super-vl-free
    - name: or-dots-3-note-free
    - name: gemini-3.5-flash-lite
  decisions:
    - name: turbo-fanout
      description: "Spread independent small calls across every fast free backend; fail over on rate limits."
      priority: 100
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - {model: groq-gpt-oss-20b, use_reasoning: false}
        - {model: groq-qwen3.8-27b, use_reasoning: false}
        - {model: groq-gpt-oss-120b, use_reasoning: false}
        - {model: cerebras-qwen-3.8-27b, use_reasoning: false}
        - {model: cerebras-gpt-oss-120b, use_reasoning: false}
      algorithm:
        type: random
      fallback:
        enabled: true
        max_attempts: 4
        total_timeout: 60s
        per_attempt_timeout: 30s
        retryable_status_codes: [413, 429, 500, 502, 503, 504]
entrypoints:
  # Default recipe = turbo (top-level routing). Profiles are virtual models picked by name; see profiles/README.md.
  - model_names: ["vllm-sr/auto", "vllm-sr/turbo"]
    recipe: default
  - model_names: ["vllm-sr/free-quality"]
    recipe: free-quality
  - model_names: ["vllm-sr/free-reasoning"]
    recipe: free-reasoning
  - model_names: ["vllm-sr/free-verify"]
    recipe: free-verify
  - model_names: ["vllm-sr/free-longctx"]
    recipe: free-longctx
  - model_names: ["vllm-sr/free-public"]
    recipe: free-public
  - model_names: ["vllm-sr/paid"]
    recipe: paid
recipes:
  - name: paid
    description: "Owner paid subscriptions for main agent turns: Claude Opus (Ultra/sub2/original pool, rotated by the sub-proxy) -> ChatGPT Sol -> Grok."
    routing:
      decisions:
        - name: paid
          description: "Ordered paid fallback; Claude first."
          priority: 100
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - {model: paid-claude-opus-5-5, use_reasoning: false}
            - {model: paid-gpt-6.1-sol, use_reasoning: false}
            - {model: paid-grok-4.7, use_reasoning: false}
          algorithm:
            type: static
          fallback:
            enabled: true
            max_attempts: 3
            total_timeout: 1800s
            per_attempt_timeout: 900s
            retryable_status_codes: [401, 403, 408, 429, 500, 502, 503, 504, 529]
  - name: free-quality
    description: "Most accurate reliable free models (hard-tier 0.94-1.00, reliability >= 0.97). Easy, well-defined, non-code work only."
    routing:
      decisions:
        - name: free-quality
          description: "Most accurate reliable free models (hard-tier 0.94-1.00, reliability >= 0.97). Easy, well-defined, non-code work only."
          priority: 100
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - {model: nim-nemotron-3.5-lightning, use_reasoning: false}
            - {model: or-nemotron-3.5-super-vl-free, use_reasoning: false}
            - {model: or-nemotron-3-ultra-free, use_reasoning: false}
            - {model: nim-nemotron-3-ultra, use_reasoning: false}
          algorithm:
            type: random
          fallback:
            enabled: true
            max_attempts: 3
            total_timeout: 240s
            per_attempt_timeout: 120s
            retryable_status_codes: [408, 413, 429, 500, 502, 503, 504]
  - name: free-reasoning
    description: "Free models with 1.00 on the reasoning family (math, dates, logic, table aggregation)."
    routing:
      decisions:
        - name: free-reasoning
          description: "Free models with 1.00 on the reasoning family (math, dates, logic, table aggregation)."
          priority: 100
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - {model: or-nemotron-3.5-super-vl-free, use_reasoning: false}
            - {model: or-nemotron-3-ultra-free, use_reasoning: false}
            - {model: nim-nemotron-3-ultra, use_reasoning: false}
            - {model: or-dots-3-note-free, use_reasoning: false}
          algorithm:
            type: random
          fallback:
            enabled: true
            max_attempts: 3
            total_timeout: 240s
            per_attempt_timeout: 120s
            retryable_status_codes: [408, 413, 429, 500, 502, 503, 504]
  - name: free-verify
    description: "Free checkers for draft->check: 1.00 on claim/answer verification."
    routing:
      decisions:
        - name: free-verify
          description: "Free checkers for draft->check: 1.00 on claim/answer verification."
          priority: 100
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - {model: or-nemotron-3.5-super-vl-free, use_reasoning: false}
            - {model: or-nemotron-3-ultra-free, use_reasoning: false}
            - {model: nim-nemotron-3-ultra, use_reasoning: false}
            - {model: or-dots-3-note-free, use_reasoning: false}
          algorithm:
            type: random
          fallback:
            enabled: true
            max_attempts: 3
            total_timeout: 240s
            per_attempt_timeout: 120s
            retryable_status_codes: [408, 413, 429, 500, 502, 503, 504]
  - name: free-longctx
    description: "Free models that found every needle at 8k-32k tokens (Groq gpt-oss 413s above 8K TPM, so it is excluded)."
    routing:
      decisions:
        - name: free-longctx
          description: "Free models that found every needle at 8k-32k tokens (Groq gpt-oss 413s above 8K TPM, so it is excluded)."
          priority: 100
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - {model: or-nemotron-3.5-super-vl-free, use_reasoning: false}
            - {model: or-nemotron-3-ultra-free, use_reasoning: false}
            - {model: nim-nemotron-3-ultra, use_reasoning: false}
            - {model: or-dots-3-note-free, use_reasoning: false}
          algorithm:
            type: random
          fallback:
            enabled: true
            max_attempts: 3
            total_timeout: 240s
            per_attempt_timeout: 120s
            retryable_status_codes: [408, 413, 429, 500, 502, 503, 504]
  - name: free-public
    description: "Gemini free tier. Google may use prompts for training: scrubbed, non-private inputs only."
    routing:
      decisions:
        - name: free-public
          description: "Gemini free tier. Google may use prompts for training: scrubbed, non-private inputs only."
          priority: 100
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - {model: gemini-3.5-flash-lite, use_reasoning: false}
          algorithm:
            type: random
          fallback:
            enabled: true
            max_attempts: 3
            total_timeout: 240s
            per_attempt_timeout: 120s
            retryable_status_codes: [408, 413, 429, 500, 502, 503, 504]
global:
  router:
    fallback:
      enabled: true
      max_attempts: 4
      circuit_breaker:
        consecutive_failures: 2
        cooldown_period: 30s
        half_open_probes: 1

version: v0.3
entrypoints:
- model_names:
  - vllm-sr/free
  - vllm-sr/auto
  recipe: default
- model_names:
  - vllm-sr/turbo
  recipe: turbo
recipes:
- name: turbo
  description: Free pool, fastest first.
  routing:
    decisions:
    - name: free-fastest
      priority: 100
      rules:
        operator: AND
        conditions: []
      description: Every probed free backend in order; next one on 408/413/429/5xx.
      algorithm:
        type: static
      modelRefs:
      - &id013
        model: or-nemotron-3.5-lightning
        use_reasoning: false
      - &id014
        model: kilo-north-mini-code
        use_reasoning: false
      - &id002
        model: or-nemotron-3-ultra
        use_reasoning: false
      - &id003
        model: nim-nemotron-3-ultra
        use_reasoning: false

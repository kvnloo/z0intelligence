        model: or-nemotron-3.5-super-vl
        use_reasoning: false
      - &id004
        model: kilo-nemotron-3.5-super-vl
        use_reasoning: false
      - &id017
        model: or-nemotron-nano-omni
        use_reasoning: false
      - &id008
        model: or-flint-v1
        use_reasoning: false
      - &id007
        model: or-dots-3-note
        use_reasoning: false
      - &id006
        model: kilo-dots-3-note
        use_reasoning: false
      - &id012
        model: kilo-nemotron-3.5-lightning
        use_reasoning: false
      - &id015
        model: or-xing4.0-29b
        use_reasoning: false
      - &id011
        model: nim-nemotron-3.5-lightning
        use_reasoning: false
      - &id009
        model: samba-gpt-oss-120b
        use_reasoning: false
      - &id010
        model: groq-gpt-oss-120b
        use_reasoning: false
      - &id016
        model: groq-qwen3.8-27b
        use_reasoning: false
      - &id018
        model: groq-gpt-oss-20b
        use_reasoning: false
      fallback:
        enabled: true
        max_attempts: 18
        per_attempt_timeout: 120s
        total_timeout: 600s
        retryable_status_codes:
        - 408
        - 413
        - 429
        - 500
        - 502
        - 503
        - 504
listeners:
- name: http-8899
  address: 0.0.0.0
  port: 8899
  timeout: 1800s
global:
  router:
    fallback:
      enabled: true
      max_attempts: 18
      circuit_breaker:
        consecutive_failures: 2
        cooldown_period: 120s
        half_open_probes: 1
  services:
    observability:
      tracing: {}
    response_api: {}
  stores:
    response_cache: {}
providers:
  defaults:
    model: kilo-nemotron-3-ultra
  models:
  - name: kilo-nemotron-3-ultra
    provider_model_id: nvidia/nemotron-3-ultra-550b-a55b:free
    backend_refs:

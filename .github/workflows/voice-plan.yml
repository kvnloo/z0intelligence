name: VoicePlan profile
on:
  push:
    paths: ['src/z0int/voice_plan.py', 'manifests/z0live_voice.v1.json', 'tests/test_voice_plan.py', '.github/workflows/voice-plan.yml']
  pull_request:
    paths: ['src/z0int/voice_plan.py', 'manifests/z0live_voice.v1.json', 'tests/test_voice_plan.py', '.github/workflows/voice-plan.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p test_voice_plan.py -v
      - run: PYTHONPATH=src python -m z0int.voice_plan manifests/z0live_voice.v1.json

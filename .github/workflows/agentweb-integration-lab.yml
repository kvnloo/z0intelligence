name: AgentWeb Integration Lab

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - name: AgentWeb contract tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_agentweb_integration.py

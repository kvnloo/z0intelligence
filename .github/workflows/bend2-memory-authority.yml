name: Bend2 memory authority law (required checker; fail closed)

on:
  pull_request:
    paths:
      - 'bend/memory_authority/**'
      - 'src/z0int/memory_contract.py'
      - 'tests/test_memory_authority_law.py'
      - 'scripts/verify_bend2_memory_authority.py'
      - '.github/workflows/bend2-memory-authority.yml'
  push:
    branches:
      - 'feat/bend2-memory-authority-law'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bend2-memory-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated hash-pinned official toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zstd
          bash bend/memory_authority/bootstrap.sh "$RUNNER_TEMP/memory-bend"
          echo "BEND2_BIN=$RUNNER_TEMP/memory-bend/bend/bin/bend" >> "$GITHUB_ENV"
          # Host clang must win over Lean's bundled clang.
          echo "PATH=/usr/bin:/bin:$PATH:$RUNNER_TEMP/memory-bend/lean-4.34.0-linux/bin" >> "$GITHUB_ENV"
      - name: Pure Python contracts and native synthetic replay
        run: |
          python -m unittest -v tests.test_memory_authority_law tests.test_memory_contract tests.test_memory_event_log tests.test_memory_optmem_tree
      - name: Genuine BendTT verdict, exhaustive finite parity and breaking mutation
        run: |
          python scripts/verify_bend2_memory_authority.py

name: AgentWeb TypeSafe SDK Lab

on:
  pull_request:
    branches: [lab/agentweb-emma-v0]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install narrow test dependencies
        run: python -m pip install pytest==8.4.2 typesafe-sdk==0.7.2
      - name: Official SDK transport and z0 semantic parity
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q             tests/test_typesafe_sdk_adapter.py             tests/test_agentweb_choice_experiment.py             tests/test_agentweb_noul_experiment.py
      - name: Bind checks to exact head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD

name: AgentWeb bridge lab

on:
  push:
    branches:
      - rfc/agentweb-z0-bridge-v1

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python -m pytest -q tests/test_agentweb_bridge.py
      - run: python -m py_compile src/z0int/agentweb_bridge.py

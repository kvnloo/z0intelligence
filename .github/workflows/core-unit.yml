name: Core unit

on:
  push:
    paths: ["src/**", "tests/**", "benchmarks/**", "pyproject.toml", "requirements.txt", "omp-extensions/**", "zer0.repo.yaml", ".github/workflows/core-unit.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "benchmarks/**", "pyproject.toml", "requirements.txt", "omp-extensions/**", "zer0.repo.yaml", ".github/workflows/core-unit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check touched Python
        run: |
          python -m py_compile \
            src/z0int/receipt.py \
            src/z0int/ao_bridge.py \
            src/z0int/memory/event_log.py \
            src/z0int/memory/optmem_tree.py \
            src/z0int/intelligence_service.py \
            src/z0int/tokenomics_emit.py \
            src/z0int/bridge/worker.py \
            src/z0int/bridge/runtime.py \
            src/z0int/backends/bench/tokenomics_bridge.py
      - name: Receipt and bridge runtime tests
        env:
          PYTHONPATH: src
          Z0INT_PYTHON: python
        run: |
          python -m unittest \
            tests.test_receipt.ReceiptBuild \
            tests.test_receipt.ReceiptClose \
            tests.test_bridge_worker.BridgeRuntimeTests \
            tests.test_memory_event_log.EventLogTests \
            tests.test_memory_optmem_tree.OptMemTreeTests \
            tests.test_ao_bridge.AOBridgeTests
      - name: Tokenomics emitter fallback tests
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("tests/test_tokenomics_emit.py")
          spec = importlib.util.spec_from_file_location("test_tokenomics_emit", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.test_provider_usage_preserves_explicit_measurement_state()
          module.test_provider_usage_does_not_invent_measurement_state()
          PY

  offline-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      Z0INT_HOME: ${{ github.workspace }}/.test-state/z0int-tests
      Z0INT_PYTHON: python
      Z0INT_KERDOIOS_ROOT: ${{ github.workspace }}/.test-deps/kerdoios
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v7
        with:
          repository: kvnloo/kerdoios
          ref: cdb43b05a328a50649d5120bffcdecea09492219
          path: .test-deps/kerdoios
          persist-credentials: false
      - name: Install pinned CPU test environment
        run: |
          python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Complete offline suite
        run: python -m pytest -q -m 'not live'
      - name: Verify published evidence
        run: |
          (cd results/raw && sha256sum -c SHA256SUMS)
          python benchmarks/verify_published.py

  reuse-multiharness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/checkout@v7
        with:
          repository: can1357/oh-my-pi
          ref: 4ff490a1cd3e567e0f4d0bc76643bf679fac4138
          path: .test-deps/omp
          persist-credentials: false
      - name: Reconstruct the frozen OMP provider boundary
        run: |
          echo 'd1fa022ce901efaa6a0bba7cf77ee2bb0913313f6f1539c6a286c97e55cffac8  omp-extensions/z0int-bridge/patches/omp-provider-boundary.patch' | sha256sum -c -
          git -C .test-deps/omp apply ../../omp-extensions/z0int-bridge/patches/omp-provider-boundary.patch
          git -C .test-deps/omp add --all
          test "$(git -C .test-deps/omp write-tree)" = 1744f67c2f25241fad2a993e499875edce999699
          (cd .test-deps/omp && bun install --frozen-lockfile --ignore-scripts)
          (cd .test-deps/omp && bun --cwd=packages/coding-agent run gen:tool-views)
          test -f .test-deps/omp/packages/coding-agent/src/export/html/tool-views.generated.js
      - name: Supply the matching frozen native addon
        run: |
          mkdir .test-deps/omp-native
          curl --fail --silent --show-error --location 'https://registry.npmjs.org/@oh-my-pi/pi-natives-linux-x64/-/pi-natives-linux-x64-18.8.1.tgz' -o .test-deps/omp-native.tgz
          echo 'a07eb7985e82b4cb8f99077bb1bc0e5f205ccf0ffe46ffd9bc63be7bd3adaa0cd08ba2df2adf040b08adc59848918ca1cbdeb8a7eca5574fdb54ad5da69337aa  .test-deps/omp-native.tgz' | sha512sum -c -
          tar -xzf .test-deps/omp-native.tgz -C .test-deps/omp-native
          cp .test-deps/omp-native/package/pi_natives.linux-x64-modern.node .test-deps/omp/packages/natives/native/
          cp .test-deps/omp-native/package/pi_natives.linux-x64-baseline.node .test-deps/omp/packages/natives/native/
          ln -s .test-deps/omp/node_modules node_modules
      - name: Install focused Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install pytest==8.4.2 PyYAML==6.0.3 fff-search==0.11.0
      - name: Verify exact integration head and owning Python tests
        env:
          PYTHONPATH: src
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          .venv/bin/python -m pytest -q tests/test_bridge_reuse.py tests/test_claude_code_adapter.py tests/test_hermes_native_capture.py tests/test_hermes_context_adapter.py tests/test_scoped_corrections.py
      - name: Verify adapter and native OMP boundaries without inference
        run: |
          bun test omp-extensions/z0int-bridge/reuse.test.ts omp-extensions/z0int-bridge/reuse.omp-boundary.test.ts omp-extensions/z0int-bridge/reuse.real-bridge.test.ts

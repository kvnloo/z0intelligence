name: Core unit

on:
  push:
    paths: ["src/**", "tests/**", "benchmarks/**", "pyproject.toml", "requirements.txt", "omp-extensions/**", "manifests/**", "harness-adapters/**", "contracts/**", "results/**", "zer0.repo.yaml", ".github/workflows/core-unit.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "benchmarks/**", "pyproject.toml", "requirements.txt", "omp-extensions/**", "manifests/**", "harness-adapters/**", "contracts/**", "results/**", "zer0.repo.yaml", ".github/workflows/core-unit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax-check touched Python
        run: |
          python -m py_compile \
            src/z0int/receipt.py
      - name: Receipt and bridge runtime tests
        env:
          PYTHONPATH: src
          Z0INT_PYTHON: python
        run: |
          python -m unittest \
            tests.test_receipt.ReceiptBuild \
            tests.test_receipt.ReceiptClose
  offline-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      Z0INT_HOME: ${{ github.workspace }}/.test-state/z0int-tests
      Z0INT_PYTHON: python
      Z0INT_KERDOIOS_ROOT: ${{ github.workspace }}/.test-deps/kerdoios
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v7
        with:
          repository: kvnloo/kerdoios
          ref: cdb43b05a328a50649d5120bffcdecea09492219
          path: .test-deps/kerdoios
          persist-credentials: false
      - name: Install pinned CPU test environment
        run: |
          python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Complete offline suite
        run: python -m pytest -q -m 'not live'

name: TypeSafe Live Shadow Smoke

on:
  pull_request:
    branches: [lab/agentweb-emma-v0]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      Z0INT_EXPERIMENTAL_JEV_SHADOW: "1"
      Z0INT_HOME: /tmp/z0int-typesafe-live
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install narrow live dependencies
        run: python -m pip install typesafe-sdk==0.7.2

      - name: Run two bounded shadow calls when credential is available
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          status_path = Path("/tmp/typesafe-live-status.json")
          if not os.environ.get("TYPESAFE_API_KEY", "").strip():
              status_path.write_text(json.dumps({
                  "schema": "z0int.typesafe_live_smoke.v1",
                  "credential_available": False,
                  "executed": False,
                  "reason": "TYPESAFE_API_KEY secret unavailable",
              }, indent=2) + "\n")
              print(status_path.read_text(), end="")
              raise SystemExit(0)

          from z0int.decision_experiment import (
              run_choice_experiment,
              run_noul_experiment,
          )
          from z0int.functions.contract import EXPECTED_JEV_MODEL

          parent = "agentweb:" + "a" * 24

          choice = run_choice_experiment({
              "harness": "agentweb",
              "trace_id": "typesafe-live-choice-v1",
              "parent_agent": parent,
              "function": "experimental_choice",
              "decision_id": "typesafe_live_choice_v1",
              "state": {
                  "filename": "fixture.html",
                  "excerpt": "ROAS 3.2x, CTR 2.4%, CPC $4.10, campaign spend $12000",
              },
              "instructions": "Classify the report.",
              "options": {
                  "performance": "Paid-media metrics and campaign performance.",
                  "research": "General market or business research.",
              },
              "allow_remote": True,
              "experimental": True,
          })

          noul = run_noul_experiment({
              "harness": "agentweb",
              "trace_id": "typesafe-live-noul-v1",
              "parent_agent": parent,
              "function": "experimental_noul",
              "decision_id": "typesafe_live_stop_v1",
              "state": {"message": "stop now"},
              "proposition": "Is the user explicitly asking the agent to stop?",
              "allow_remote": True,
              "experimental": True,
          })

          assert choice.get("ok") is True, choice
          assert choice.get("executed") is True, choice
          assert choice.get("applied") is False, choice
          assert choice.get("output", {}).get("model") == EXPECTED_JEV_MODEL, choice

          assert noul.get("ok") is True, noul
          assert noul.get("executed") is True, noul
          assert noul.get("applied") is False, noul
          assert noul.get("output", {}).get("model") == EXPECTED_JEV_MODEL, noul

          receipts = Path(os.environ["Z0INT_HOME"]) / "receipts" / "decisions.jsonl"
          rows = [
              json.loads(line)
              for line in receipts.read_text().splitlines()
              if line.strip()
          ]
          completed = [
              row for row in rows
              if row.get("execution") == "shadow"
              and row.get("extra", {}).get("status") == "completed"
              and row.get("extra", {}).get("quality_authoritative") is False
          ]
          assert len(completed) == 2, rows

          status = {
              "schema": "z0int.typesafe_live_smoke.v1",
              "credential_available": True,
              "executed": True,
              "choice": {
                  "label": choice["output"].get("label"),
                  "model": choice["output"].get("model"),
                  "input_tokens": choice["output"].get("usage", {}).get("input_tokens"),
                  "output_tokens": choice["output"].get("usage", {}).get("output_tokens"),
                  "applied": choice.get("applied"),
              },
              "noul": {
                  "probability": noul["output"].get("probability"),
                  "model": noul["output"].get("model"),
                  "input_tokens": noul["output"].get("usage", {}).get("input_tokens"),
                  "output_tokens": noul["output"].get("usage", {}).get("output_tokens"),
                  "applied": noul.get("applied"),
              },
              "completed_receipts": len(completed),
          }
          status_path.write_text(json.dumps(status, indent=2) + "\n")
          print(status_path.read_text(), end="")
          PY

      - name: Bind smoke to exact head
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD

      - name: Upload live-smoke status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typesafe-live-shadow-smoke
          path: |
            /tmp/typesafe-live-status.json
            /tmp/z0int-typesafe-live/receipts/decisions.jsonl
          if-no-files-found: warn

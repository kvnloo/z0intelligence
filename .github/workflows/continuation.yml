name: Continuation restart proof

on:
  pull_request:
    paths:
      - 'src/z0int/continuation*.py'
      - 'src/z0int/task_loop.py'
      - 'tests/*continuation*.py'
      - 'tests/test_task_crash_regression.py'
      - 'tests/test_task_loop.py'
      - '.github/workflows/continuation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONPATH: src:tests
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only lightweight test dependencies
        run: |
          python -m pip install pytest==8.4.2 PyYAML==6.0.3 \
            'aodl-contract @ git+https://github.com/kvnloo/aodl.git@68231658f0ec0338464c0916a2329b9587444312'
      - name: Syntax and real EventLog availability
        run: |
          python -m py_compile src/z0int/continuation.py src/z0int/continuation_adapters.py src/z0int/task_loop.py
          python -c 'from z0int.memory.event_log import EventLog'
      - name: Contract, crash, concurrency and original integration tests
        run: |
          python -m pytest -q \
            tests/test_continuation.py tests/test_continuation_adapters.py \
            tests/test_task_continuation.py tests/test_task_crash_regression.py \
            tests/test_task_loop.py tests/test_memory_event_log.py \
            --junitxml=continuation-results.xml
      - name: Prove the crash regression fails on the old implementation
        shell: bash
        run: |
          cp -a src "$RUNNER_TEMP/continuation-base-src"
          git show 43b796aa8752e703fdb119b8660a0d28c1de0a44:src/z0int/task_loop.py \
            > "$RUNNER_TEMP/continuation-base-src/z0int/task_loop.py"
          set +e
          PYTHONPATH="$RUNNER_TEMP/continuation-base-src:tests" \
            python -m pytest -q tests/test_task_crash_regression.py > continuation-red.log 2>&1
          status=$?
          set -e
          cat continuation-red.log
          test "$status" -ne 0
          grep -F 'patch find-string not present (not applied)' continuation-red.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-proof-python-${{ matrix.python }}
          path: |
            continuation-results.xml
            continuation-red.log

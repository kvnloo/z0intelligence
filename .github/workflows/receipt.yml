name: Evidence receipt

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  receipt:
    # Dependabot descriptions carry no receipt block. Keyed on the PR author,
    # not github.actor, and on this one login, not on every bot.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check evidence receipt and exact head
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$BODY" > /tmp/pr-body.md
          python3 .github/scripts/check-receipt.py --file /tmp/pr-body.md --head "$HEAD"

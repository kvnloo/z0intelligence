# TencentDB Agent Memory gateway (memory-core) config for tencentdb-memory.service.
# Mounted read-only at /data/config/tdai-gateway.yaml inside the container.
#
# NO SECRETS IN THIS FILE. The LLM endpoint/model/key are supplied as
# TDAI_LLM_BASE_URL / TDAI_LLM_MODEL / TDAI_LLM_API_KEY by bin/tencentdb-memory-run
# (env overrides yaml in src/gateway/config.ts). The key comes from Bitwarden
# Secrets Manager at start and reaches the container on stdin only.
#
# Everything below `memory:` / `skill:` is copied unchanged from the config that
# deploy/global-images/start-memory-core.sh generated for the 2026-09-17 stack
# (/mnt/zer0models/oss/TencentDB-Agent-Memory/deploy/global-images/.memory-core-config/),
# minus its inline llm credentials, so behaviour matches the historical setup.
deployMode: standalone
stateBackend: local

server:
  port: 8420
  host: 127.0.0.1

data:
  baseDir: /data/tdai-memory

llm:
  maxTokens: 32000
  timeoutMs: 300000

memory:
  promptMode: chat
  capture: { enabled: true }
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  persona:
    triggerEveryN: 50
    maxScenes: 15
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: hybrid
    timeoutMs: 5000
  storeBackend: sqlite
  embedding:
    provider: none

skill:
  enabled: true
  routing:
    mode: bm25
    searchTopK: 20
  extraction:
    enabled: true
    maxIterations: 16
    queue:
      backend: local
      keyPrefix: tdai
      resultTtlSeconds: 86400
      lockTtlMs: 600000
      maxRetries: 2
      retryBackoffsMs: [5000, 15000]
  resources:
    maxResourceSizeBytes: 5000000

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openjev-phase1"
version = "0.2.0"
description = "Open baselines for runtime-defined semantic decisions"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
dependencies = [
  "torch==2.10.0",
  "transformers==5.17.0",
  "accelerate==1.12.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.31.0",
  "tokenizers==0.23.2",
  "numpy==2.2.6",
  "sentencepiece==0.2.1",
  "protobuf==7.36.1",
]

[project.scripts]
openjev-score = "openjev_phase1.cli:main"
openjev-data = "openjev_phase1.jevlike.data:main"
openjev-train = "openjev_phase1.jevlike.train:main"
openjev-eval = "openjev_phase1.jevlike.eval:main"
openjev-predict = "openjev_phase1.jevlike.predict:main"
openjev-bridge-score = "openjev_phase1.jevlike.bridge:main"
z0int = "z0int.cli:main"
z0int-compile = "z0int.compile:main"
z0int-train-next-action = "z0int.train:main"
[project.optional-dependencies]
  # Runtime deps for the decision backends and verifiers that ship in this tree.
  # `laya` and `flash-linear-attention` were previously declared ONLY in
  # requirements.txt, so the documented `pip install -e '.[test]'` produced an
  # environment where the laya live tests failed with `No module named 'laya'`.
  verifiers = [
    "laya==0.1.6",
    "flash-linear-attention==0.5.2",
  ]
  test = [
    "pytest==8.4.2",
    "agent-tokenomics @ git+https://github.com/kvnloo/tokenomics.git@e67d76fe2f1d52a5911abc8974489a10e89bb431",
    # the suite exercises the verifier backends, so the test extra pulls them in
    "laya==0.1.6",
    "flash-linear-attention==0.5.2",
  ]
analytics = ["agent-tokenomics @ git+https://github.com/kvnloo/tokenomics.git@e67d76fe2f1d52a5911abc8974489a10e89bb431"]
games = [
  "chess>=1.11",
  "imageio>=2.37",
  "imageio-ffmpeg>=0.6",
  "pillow>=11",
  "vizdoom>=1.2.4",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "webgpu-demo"]
markers = [
  "live: requires a live provider or an external verifier; deselect with -m 'not live'",
]

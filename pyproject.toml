[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openjev-phase1"
version = "0.2.0"
description = "Open baselines for runtime-defined semantic decisions"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
dependencies = [
  "fff-search==0.11.0",
  "typesafe-sdk==0.7.2",
  "torch==2.10.0",
  "transformers==5.17.0",
  "accelerate==1.12.0",
  "safetensors==0.8.0",
  "huggingface-hub==1.31.0",
  "tokenizers==0.23.2",
  "numpy==2.2.6",
  "sentencepiece==0.2.1",
  "protobuf==7.36.1",
  "aodl-contract @ git+https://github.com/kvnloo/aodl.git@68231658f0ec0338464c0916a2329b9587444312",
]

[project.scripts]
[project.optional-dependencies]
test = ["pytest==8.4.2", "PyYAML==6.0.3", "agent-tokenomics @ git+https://github.com/kvnloo/tokenomics.git@2ae90511a900fdb3dcc576c9634cd8d9ee1c8d6a"]
analytics = ["agent-tokenomics @ git+https://github.com/kvnloo/tokenomics.git@2ae90511a900fdb3dcc576c9634cd8d9ee1c8d6a"]
image = ["pillow>=11", "torchvision"]
games = [
  "chess>=1.11",
  "imageio>=2.37",
  "imageio-ffmpeg>=0.6",
  "pillow>=11",
  "vizdoom>=1.2.4",
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"z0int.optchat" = ["*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests", "webgpu-demo"]
markers = ["live: requires configured external or local model services"]

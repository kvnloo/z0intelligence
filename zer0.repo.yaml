version: 1
repo: kvnloo/z0intelligence
id: z0intelligence
component: z0intelligence
kind: component
summary: Provenance-backed cognition and control plane for resolving evidence, compiling legal state/action spaces,
  routing among evidence-eligible capabilities, enforcing dispatch authority, and emitting auditable decisions and
  outcomes.
architecture:
  subsystems:
  - id: context-resolution
    name: Provenance-backed context resolution
    kind: memory
    summary: Resolves explicit information needs into bounded source-backed ContextPackets without becoming a second
      memory database or treating retrieval as belief.
    paths:
    - src/z0int/context_resolve.py
    - tests/test_context_resolve.py
  - id: capability-router
    name: Evidence-gated capability router
    kind: decision
    summary: Chooses only among capabilities whose registered evidence makes them eligible for the requested contract;
      missing evidence falls back rather than silently granting authority.
    paths:
    - src/z0int/intelligence.py
    - src/z0int/intelligence_service.py
    - src/z0int/capabilities/
    - manifests/capabilities.v1.json
    - manifests/capability-evidence/
    - tests/test_intelligence.py
    - tests/test_intelligence_canonical.py
    - tests/test_intelligence_service.py
    depends_on:
    - context-resolution
  - id: dispatch-authority
    name: Dispatch authority
    kind: authority
    summary: Owns execution identity, replay/conflict protection, idempotency and canonical receipts so model/backend
      choice cannot execute twice or self-authorize tool access.
    paths:
    - src/z0int/dispatch_authority.py
    - src/z0int/receipt.py
    - src/z0int/bridge/
    - tests/test_dispatch_authority.py
    - src/z0int/intelligence.py
    depends_on:
    - capability-router
  - id: local-cognition-compiler
    name: Deterministic local cognition compiler
    kind: policy
    summary: Compiles legal actions, permissions, budgets, quality/risk requirements, candidate sets and escalation
      rules before any learned system is allowed to choose.
    paths:
    - src/z0int/cognition/
    - manifests/local_cognition.v1.json
    - tests/test_cognition_compiler.py
    - tests/test_cognition_candidates.py
    - tests/test_cognition_cascade.py
    - tests/test_cognition_orchestration.py
    - tests/test_cognition_surface.py
    depends_on:
    - context-resolution
  - id: typed-decision-backends
    name: Typed decision backends
    kind: decision
    summary: Hosts provider-neutral finite-choice backends and functions including Jev, Laya, OpenJev/direct logits,
      Decider, legacy NanoJev, Julia-1 and image-decision experiments; registration alone does not confer routing
      eligibility.
    paths:
    - src/z0int/backends/
    - src/z0int/functions/
    - src/z0int/image_decision_cli.py
    - manifests/models.json
    - manifests/models.z0int.json
    - tests/test_backend_contract.py
    depends_on:
    - local-cognition-compiler
  - id: harness-adapters
    name: Harness adapters and worker projection
    kind: integration
    summary: Projects identity, context resolution, decisions, outcomes and worker activity into OMP, Hermes, DeepSeek
      Harness and other harness-native seams without moving execution authority into z0intelligence.
    paths:
    - adapters/
    - harness-adapters/
    - omp-extensions/
    - src/z0int/worker_activity.py
    - src/z0int/worker_routing.py
    - tests/test_worker_activity.py
    - tests/test_worker_routing.py
    depends_on:
    - dispatch-authority
    - typed-decision-backends
  - id: tokenomics-bridge
    name: Measurement-complete Tokenomics bridge
    kind: measurement
    summary: Emits decision/provider usage with explicit completeness state so partial or unsupported observations
      cannot masquerade as measured savings.
    paths:
    - src/z0int/tokenomics_emit.py
    - src/z0int/backends/bench/tokenomics_bridge.py
    - tests/test_tokenomics_emit.py
    - tests/test_tokenomics_bridge.py
    depends_on:
    - dispatch-authority
  - id: remote-executor-protocol
    name: Claim-based remote executor protocol
    kind: execution
    summary: 'Keeps remote execution stateless: the executor must claim one request identity from host authority,
      acquire provider admission, persist ordered physical receipts through the authority, and reconcile uncertain
      execution instead of retrying under a new trace.'
    paths:
    - src/z0int/remote_executor.py
    - src/z0int/dispatch_authority.py
    - src/z0int/provider_saturation.py
    - src/z0int/worker_routing.py
    - tests/test_dispatch_authority.py
    depends_on:
    - dispatch-authority
    - local-cognition-compiler
  - id: k8s-hermes-lab
    name: Kubernetes hermes-lab execution lane
    kind: deployment
    summary: Current merged topology is a single-replica bounded remote-worker lane, not an autoscaled all-model
      fabric. z0int decision/dispatch authority and local Laya/SoL-Pi/RLM control remain host-side; the in-cluster
      executor defaults to the explicitly enabled OpenRouter provider, with provider credentials scoped as Kubernetes
      secrets.
    paths:
    - deploy/k8s/intelligence-host-service.yaml
    - deploy/k8s/intelligence-executor.yaml
    - src/z0int/remote_executor.py
    depends_on:
    - remote-executor-protocol
  - id: evolution-contract
    name: Evolution Lab runtime contract
    kind: learning
    summary: Defines the runtime/evolution boundary, export paths, locked split expectations, specialist deployment
      contract and evidence-backed promotion expectations with Evolution Lab.
    paths:
    - docs/evolution-lab.md
    - docs/observer-evaluation.md
    - docs/decision-capability-v2-plan.md
    - src/z0int/specialists/
    - src/z0int/routines.py
    depends_on:
    - typed-decision-backends
    - tokenomics-bridge
  - id: aodl-contract
    name: AODL compilation and runtime contract
    kind: orchestration
    summary: Maps intent, authority, budgets, plan bindings, provenance and observed outcomes into the z0int runtime
      without extending AODL's canonical ontology.
    paths:
    - src/z0int/aodl.py
    - docs/aodl-integration.md
    - examples/aodl/
    depends_on:
    - context-resolution
    - local-cognition-compiler
    - dispatch-authority
  - id: agentweb-shadow-planner
    name: AgentWeb shadow planner
    kind: integration
    paths:
    - src/z0int/automatic.py
    - src/z0int/intelligence_service.py
    depends_on:
    - dispatch-authority
  - id: agentweb-choice-experiments
    name: AgentWeb bounded decision experiment lane
    kind: experimental-decision
    paths:
    - src/z0int/decision_experiment.py
    - src/z0int/functions/jev.py
    depends_on:
    - dispatch-authority
  - id: agentweb-context-packet
    name: AgentWeb preselected-evidence ContextPacket compiler
    kind: context-compiler
    paths:
    - src/z0int/agentweb_context_packet.py
    - src/z0int/context_resolve.py
    depends_on:
    - dispatch-authority
  - id: agentweb-reliability-observations
    name: AgentWeb reliability observation ingest
    kind: evidence-ingest
    paths:
    - src/z0int/reliability_observation.py
    depends_on:
    - dispatch-authority
  implements_mechanisms:
  - jev-typed-decision
  - unified-memory-evidence-path
  provides_interfaces:
  - z0int.decision_receipt.v1
  - z0int.context_resolve.v1
  consumes_interfaces:
  - tokenomics.report.v1
  - aodl.intent.v1
  produces_representations:
  - compiled-decision-state
  - decision-receipt
  - context-packet
  consumes_representations:
  - raw-context
  - tokenomics-event
  - aodl-intent
  - compiled-decision-state
  boundaries:
    owns:
    - provenance-backed context resolution
    - evidence-gated capability routing
    - deterministic legal-action and policy compilation
    - typed decision backend/runtime contracts
    - dispatch identity, replay/conflict protection and receipts
    - personal specialist and routine runtime
    - harness adapter contracts
    - z0int deployment topology
    - z0 routing, idempotency, request fingerprinting, dispatch claims, and decision receipts.
    - Remote-context and specialist eligibility policy.
    not_here:
    - source memory database authority
    - harness execution ownership
    - experiment promotion authority
    - token measurement authority
    - provider/resource allocation authority
    - canonical AODL ontology
    - AgentWeb user identity or account authorization.
    - AgentWeb confirmation, evaluation-workspace, funding, scheduling, or publish policy.
  evidence:
    docs:
    - README.md
    - ROADMAP.md
    - docs/intelligence-layer.md
    - docs/local-cognition-portfolio.md
    - docs/aodl-integration.md
    - docs/evolution-lab.md
    - docs/observer-evaluation.md
    - adapters/hermes-z0int/README.md
    - docs/agentweb-emma-integration.md
    tests:
    - tests/test_context_resolve.py
    - tests/test_intelligence.py
    - tests/test_intelligence_canonical.py
    - tests/test_dispatch_authority.py
    - tests/test_cognition_compiler.py
    - tests/test_backend_contract.py
    - tests/test_hermes_adapter.py
    - tests/test_z0int_aodl.py
    - tests/test_tokenomics_emit.py
    - tests/test_agentweb_integration.py
    - tests/test_agentweb_choice_experiment.py
    - tests/test_agentweb_reliability_observation.py
    - tests/test_agentweb_context_packet.py
    schemas:
    - manifests/
    - manifests/capabilities.v1.json

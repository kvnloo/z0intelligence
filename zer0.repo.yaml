version: 1
repo: kvnloo/z0intelligence
id: z0intelligence
component: z0intelligence
kind: component
summary: Personal intelligence layer for provenance-backed context resolution, bounded decisions, specialist runtime, and auditable offload.

architecture:
  subsystems:
    - id: context-resolution
      name: Provenance-backed context resolution
      kind: memory
      summary: Resolves explicit information needs into bounded source-backed ContextPackets without becoming a second memory database.
      paths:
        - src/z0int/context_resolve.py
        - tests/test_context_resolve.py

    - id: bounded-decision-runtime
      name: Bounded decision runtime
      kind: decision
      summary: Hosts typed finite-choice backends, named-question transport, receipts, and local decision functions.
      paths:
        - src/z0int/backends/
        - src/z0int/functions/
        - src/z0int/receipt.py
        - src/z0int/cognition/
        - manifests/
      depends_on: [context-resolution]

    - id: harness-adapters
      name: Harness adapters
      kind: integration
      summary: Projects z0int identity, context resolution, decisions, and outcomes into Hermes, DeepSeek Harness, OMP, and other harness-native seams.
      paths:
        - adapters/
        - harness-adapters/
        - omp-extensions/
      depends_on: [context-resolution, bounded-decision-runtime]

    - id: k8s-hermes-lab
      name: Kubernetes hermes-lab execution lane
      kind: deployment
      summary: Keeps z0int host authority and local credentials/models separate from a hardened in-cluster executor reached through the hermes-lab service boundary.
      paths:
        - deploy/k8s/intelligence-host-service.yaml
        - deploy/k8s/intelligence-executor.yaml
      depends_on: [bounded-decision-runtime]

    - id: evolution-contract
      name: Evolution Lab runtime contract
      kind: learning
      summary: Defines the runtime/evolution boundary, export paths, locked split expectations, and specialist deployment contract with Evolution Lab.
      paths:
        - docs/evolution-lab.md
        - docs/observer-evaluation.md
        - docs/decision-capability-v2-plan.md
      depends_on: [bounded-decision-runtime]

    - id: aodl-contract
      name: AODL compilation and runtime contract
      kind: orchestration
      summary: Maps z0int policies and outcomes into AODL intent, plan bindings, budgets, provenance, and state updates without extending AODL ontology.
      paths:
        - src/z0int/aodl.py
        - docs/aodl-integration.md
        - examples/aodl/
      depends_on: [context-resolution, bounded-decision-runtime]

  implements_mechanisms:
    - jev-typed-decision
    - unified-memory-evidence-path

  provides_interfaces:
    - z0int.decision_receipt.v1
    - z0int.context_resolve.v1

  consumes_interfaces:
    - tokenomics.report.v1
    - aodl.intent.v1

  produces_representations:
    - compiled-decision-state
    - decision-receipt
    - context-packet

  consumes_representations:
    - raw-context
    - tokenomics-event
    - aodl-intent

  boundaries:
    owns:
      - provenance-backed context resolution
      - bounded decision backends and receipts
      - personal specialist and routine runtime
      - harness adapter contracts
      - z0int deployment topology
    not_here:
      - source memory database authority
      - harness execution ownership
      - experiment promotion authority
      - token measurement authority
      - canonical AODL ontology

  evidence:
    docs:
      - README.md
      - ROADMAP.md
      - docs/aodl-integration.md
      - docs/evolution-lab.md
      - adapters/hermes-z0int/README.md
    tests:
      - tests/test_context_resolve.py
      - tests/test_backend_contract.py
      - tests/test_hermes_adapter.py
      - tests/test_z0int_aodl.py
    schemas:
      - manifests/

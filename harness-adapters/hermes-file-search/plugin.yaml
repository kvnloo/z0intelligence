name: hermes-file-search
version: "0.1.0"
description: Thin repository search tool for the shared z0intelligence HTTP service.
manifest_version: 2
kind: standalone
provides_tools:
  - z0_file_search
provides_hooks: []
python_dependencies: []
config_schema:

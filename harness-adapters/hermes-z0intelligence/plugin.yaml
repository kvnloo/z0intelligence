name: hermes-z0intelligence
version: 0.2.0
manifest_version: 1
kind: standalone
description: "z0intelligence for Hermes: shadow capture of DecisionOpportunities, turn outcomes and content-free hook events into $Z0INT_HOME/state/hermes (never alters a turn), plus the evidence-gated automatic call (inert unless automatic.json enables hermes)."
license: MIT
provides_tools: []
provides_hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - on_session_end
  - pre_approval_request
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_auxiliary_call
  - post_auxiliary_call
  - subagent_stop
config_schema:
  mode:
    type: str
    default: "off"
    label: Capture mode
    description: off (no capture hook is registered) or shadow (records metadata; every hook returns None).
  opportunities:
    type: bool
    default: true
    label: Shadow DecisionOpportunities
    description: Build a DecisionOpportunity for each user turn in a detached z0int child (bounded pool).
  z0int_python:
    type: str
    default: ""
    label: z0int interpreter
    description: Python of the installed z0int (else Z0INT_PYTHON, else $Z0INT_HOME/config/hermes.json python).
  z0int_home:
    type: str
    default: ""
    label: z0int home
    description: Where rows are written (state/hermes). Empty uses Z0INT_HOME or ~/.z0int.
  persist_packet_text:
    type: bool
    default: false
    label: Keep State Packet text
    description: Privacy class packet_text opt_in. Off digests README open items, commit subjects and branch names.
